<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEREKH — דֶּרֶךְ | Plateforme internationale IA & Torah</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <img src="logo.svg" alt="Logo DEREKH" class="logo-svg">
                    <span class="logo-title">DEREKH</span>
                </div>
                <button class="mobile-close" id="mobileClose">&times;</button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#home" class="nav-link active" data-view="home">🏠 Accueil</a>
                <a href="#assistant" class="nav-link" data-view="assistant">✨ Assistant IA</a>
                <a href="#library" class="nav-link" data-view="library">📚 Bibliothèque</a>
                <a href="#reader" class="nav-link" data-view="reader">📖 Lecteur de Textes</a>
                <a href="#rabbanim" class="nav-link" data-view="rabbanim">🎓 Rabbanim & Enseignements</a>
                <a href="#dashboard" class="nav-link" data-view="dashboard">📊 Mon Parcours</a>
                <a href="#habits" class="nav-link" data-view="habits">🌿 Maîtrise de Soi</a>
            </nav>

            <div class="sidebar-footer">
                <div class="session-timer">⏱️ Session : <strong id="timer">00:00</strong></div>
                <p class="motto">« La Torah comme fondation. »</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button class="mobile-toggle" id="mobileToggle">☰</button>
                <div class="header-title" id="headerTitle">Accueil</div>
                <div class="header-actions">
                    <select id="langSelect" class="lang-select">
                        <option value="fr">Français</option>
                        <option value="he">עברית</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </header>

            <div class="content-body" id="viewContainer">
                <!-- Vues injectées dynamiquement -->
            </div>
        </main>
    </div>

    <!-- Scripts à plat -->
    <script src="data.js"></script>
    <script src="search.js"></script>
    <script src="assistant.js"></script>
    <script src="library.js"></script>
    <script src="reader.js"></script>
    <script src="rabbanim.js"></script>
    <script src="dashboard.js"></script>
    <script src="app.js"></script>
</body>
</html>
